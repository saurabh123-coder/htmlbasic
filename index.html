<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>District Movies</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f7f5ff;
        }


        /* ================= NAVBAR ================= */

        .navbar {
            height: 66px;
            background-color: white;

            display: flex;
            align-items: center;

            padding: 0 20px;

            border-bottom: 1px solid #eeeeee;

            gap: 15px;
        }


        /* ================= DISTRICT LOGO ================= */

        .logo-link {
            width: 108px;

            display: flex;
            align-items: center;

            text-decoration: none;
        }

        .district-logo {
            width: 105px;
            height: auto;

            display: block;

            object-fit: contain;
        }


        /* ================= DIVIDER ================= */

        .divider {
            width: 1px;
            height: 32px;

            background-color: #dddddd;

            margin: 0 5px;
        }


        /* ================= LOCATION ================= */

        .location {
            display: flex;
            align-items: center;

            gap: 10px;

            min-width: 195px;
        }

        .location-icon {
            font-size: 27px;

            color: #6842ff;
        }

        .location-text {
            display: flex;
            flex-direction: column;

            gap: 3px;
        }

        .city {
            font-size: 16px;

            font-weight: bold;

            color: #222;
        }

        .state {
            font-size: 13px;

            color: #555;
        }


        /* ================= NAV LINKS ================= */

        .nav-links {
            display: flex;
            align-items: center;

            gap: 27px;

            flex: 1;

            margin-left: 5px;
        }

        .nav-link {
            text-decoration: none;

            color: #333;

            font-size: 14px;

            font-weight: 600;

            white-space: nowrap;

            padding: 10px 2px;

            cursor: pointer;
        }


        /* FOR YOU */

        .nav-link.active {
            background-color: #eee7ff;

            color: #4d27d8;

            padding: 10px 18px;

            border-radius: 22px;
        }

        .nav-link:hover {
            color: #6842ff;
        }


        /* ================= SEARCH ================= */

        .search {
            width: 28px;
            height: 28px;

            display: flex;

            align-items: center;
            justify-content: center;

            color: #5c3cff;

            cursor: pointer;

            margin-left: auto;

            font-size: 25px;
        }


        /* ================= PROFILE ================= */

        .profile {
            width: 43px;
            height: 43px;

            border-radius: 50%;

            background-color: #d9dce2;

            display: flex;

            align-items: center;
            justify-content: center;

            color: white;

            font-size: 20px;

            cursor: pointer;

            margin-left: 10px;
        }


        /* ================= MOVIE SECTION ================= */

        .main-content {
            padding: 22px 50px;
        }

        .parentbox {
            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 16px;
        }


        /* ================= MOVIE CARD ================= */

        .movie-cart {
            background-color: white;

            border: 1px solid #ddd;

            border-radius: 16px;

            overflow: hidden;

            display: flex;
            flex-direction: column;

            opacity: 0;

            transform: translateY(50px);

            animation: cardUp 0.8s ease forwards;
        }


        /* ================= IMAGE ================= */

        .movie-cart img {
            width: 100%;

            height: 260px;

            object-fit: contain;

            display: block;
        }


        /* ================= MOVIE INFO ================= */

        .movie-info {
            padding: 14px 12px;

            display: flex;
            flex-direction: column;

            flex: 1;
        }

        .movie-name {
            font-size: 17px;

            font-weight: bold;

            margin-bottom: 5px;

            line-height: 1.3;
        }

        .movie-details {
            font-size: 14px;

            color: #555;
        }


        /* ================= BOOK BUTTON ================= */

        .book-btn {
            width: 100px;

            padding: 8px 10px;

            margin-top: auto;

            border: none;

            border-radius: 6px;

            background-color: black;

            color: white;

            font-size: 13px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .book-btn:hover {
            background-color: #333;

            transform: translateY(-2px);
        }


        /* ================= ANIMATION ================= */

        @keyframes cardUp {

            from {
                opacity: 0;

                transform: translateY(50px);
            }

            to {
                opacity: 1;

                transform: translateY(0);
            }

        }

        .movie-cart:nth-child(1) {
            animation-delay: 0s;
        }

        .movie-cart:nth-child(2) {
            animation-delay: 0.2s;
        }

        .movie-cart:nth-child(3) {
            animation-delay: 0.4s;
        }

        .movie-cart:nth-child(4) {
            animation-delay: 0.6s;
        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 1100px) {

            .nav-links {
                gap: 15px;
            }

            .location {
                min-width: 150px;
            }

            .parentbox {
                grid-template-columns: repeat(3, 1fr);
            }

        }


        @media (max-width: 850px) {

            .nav-links {
                display: none;
            }

            .parentbox {
                grid-template-columns: repeat(2, 1fr);
            }

        }


        @media (max-width: 550px) {

            .navbar {
                padding: 0 12px;
            }

            .location {
                min-width: auto;
            }

            .state {
                display: none;
            }

            .main-content {
                padding: 20px;
            }

            .parentbox {
                grid-template-columns: 1fr;
            }

        }
        .logo {
    color: #111111;
}

.logo-small {
    color: #111111;
}

    </style>

</head>


<body>
